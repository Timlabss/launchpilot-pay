name: pay-verifier

on:
  schedule:
    - cron: "*/3 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: verify payments
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python3 -u pay/verifier.py
