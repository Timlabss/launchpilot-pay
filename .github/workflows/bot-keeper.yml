name: bot-keeper

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: check & revive
        env:
          GH: ${{ github.token }}
        run: |
          set +e
          LATEST=$(curl -s -H "Authorization: Bearer $GH" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot-runner.yml/runs?per_page=5" \
            | python3 -c "
          import sys, json
          alive = 'none'
          try:
              runs = json.load(sys.stdin).get('workflow_runs', [])
              for r in runs:
                  if r['status'] in ('queued', 'in_progress'):
                      alive = r['status']
                      break
          except Exception:
              pass
          print(alive)
          ")
          echo "runner: $LATEST"
          if [ "$LATEST" = "none" ]; then
            curl -s -o /dev/null -w "dispatch http=%{http_code}\n" \
              -X POST -H "Authorization: Bearer $GH" -H "Content-Type: application/json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot-runner.yml/dispatches" \
              -d '{"ref":"main"}'
          fi
