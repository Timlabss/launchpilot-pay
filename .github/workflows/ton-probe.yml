name: ton-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe TON APIs
        run: |
          {
            echo "=== tonapi balance ==="
            curl -s -m 20 "https://tonapi.io/v2/account/UQDL_6KhMWWJo7-25Nl8mCkdQZgiyNdgx8PofVZcHESDVwUk"
            echo; echo "=== tonapi tx list ==="
            curl -s -m 20 "https://tonapi.io/v2/transactions?account=UQDL_6KhMWWJo7-25Nl8mCkdQZgiyNdgx8PofVZcHESDVwUk&limit=3"
            echo; echo "=== toncenter getAccount ==="
            curl -s -m 20 "https://toncenter.com/api/v2/getAccount?address=UQDL_6KhMWWJo7-25Nl8mCkdQZgiyNdgx8PofVZcHESDVwUk"
            echo; echo "=== toncenter getTransactions ==="
            curl -s -m 20 -X POST "https://toncenter.com/api/v2/getTransactions" -H "Content-Type: application/json" -d '{"address":"UQDL_6KhMWWJo7-25Nl8mCkdQZgiyNdgx8PofVZcHESDVwUk","limit":3}'
            echo; echo "=== tonapi rate TON/USD ==="
            curl -s -m 20 "https://tonapi.io/v2/currencies/TON/USD"
            echo; echo "PROBE DONE"
          } | tee /tmp/probe.txt | head -c 6000
      - name: save probe to state branch
        env:
          GH: ${{ github.token }}
        run: |
          B64=$(base64 -w0 /tmp/probe.txt)
          curl -s -X PUT -H "Authorization: Bearer $GH" -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/state/probe.txt" \
            -d "{\"message\":\"ton probe result\",\"content\":\"$B64\",\"branch\":\"state\"}" -o /dev/null -w "save http=%{http_code}\n"
