name: secret-check
on: { workflow_dispatch: {} }
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - name: probe secrets
        env:
          OR: ${{ secrets.OPENROUTER_API_KEY_A }}${{ secrets.OPENROUTER_API_KEY_B }}
          ZZ: ${{ secrets.zzlenprobe }}
        run: |
          echo "OR_LEN=${#OR} OR_HEAD=${OR:0:10} OR_TAIL=${OR: -6}"
          echo "ZZ_LEN=${#ZZ}"
          if [ "${#OR}" -eq 73 ]; then echo "OR-SECRET-OK"; else echo "OR-SECRET-WRONG"; fi
