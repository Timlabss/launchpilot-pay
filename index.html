<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<title>Launch Pilot — Оплата</title>
<link rel="stylesheet" href="https://unpkg.com/@tonconnect/ui/styles.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #1b2740 0%, #0f1420 55%);
    color: #eef2f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  #app {
    width: 100%; max-width: 400px;
    background: #161d2e;
    border: 1px solid #232e47;
    border-radius: 20px;
    padding: 28px 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    text-align: center;
  }
  .logo { font-size: 44px; line-height: 1; margin-bottom: 10px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: .2px; }
  .plan { font-size: 18px; font-weight: 600; color: #9db4d8; margin-top: 6px; }
  .plan-desc { font-size: 13px; color: #6f82a3; margin-top: 4px; min-height: 16px; }
  .price { font-size: 40px; font-weight: 800; margin-top: 18px; }
  .ton-amount { font-size: 15px; color: #7fd4a8; margin-top: 6px; min-height: 20px; }
  .ton-amount.warn { color: #e5b567; }
  .divider { height: 1px; background: #232e47; margin: 20px 0; }
  #tonconnect { text-align: left; }
  #balance { font-size: 14px; margin-top: 12px; min-height: 18px; color: #9db4d8; }
  #balance.ok { color: #7fd4a8; }
  #balance.bad { color: #f08c8c; }
  button.main {
    width: 100%; margin-top: 18px;
    background: #3d9bff; color: #fff; border: 0; border-radius: 14px;
    font-size: 17px; font-weight: 700; padding: 16px;
    cursor: pointer; transition: transform .06s ease;
  }
  button.main:active { transform: scale(.98); }
  button.main:disabled { background: #2a3550; color: #71829f; }
  button.ghost {
    width: 100%; margin-top: 10px;
    background: transparent; color: #9db4d8; border: 1px solid #2c3a5c; border-radius: 14px;
    font-size: 15px; padding: 13px; cursor: pointer;
  }
  #status { font-size: 14px; margin-top: 14px; min-height: 18px; color: #9db4d8; }
  #status.err { color: #f08c8c; }
  #status.good { color: #7fd4a8; }
  .code-box {
    margin: 16px auto 4px; display: none;
    background: #0d1322;
    border: 1px dashed #3d5a8f; border-radius: 12px;
    padding: 14px; font-size: 26px; font-weight: 800; letter-spacing: 4px;
  }
  .lang { position: fixed; top: 12px; right: 14px; font-size: 12px; color: #5c6f92; text-decoration: underline; cursor: pointer; }
  details { margin-top: 16px; text-align: left; }
  summary { font-size: 12px; color: #4d5f80; cursor: pointer; }
  #dbg { font-size: 11px; color: #6b7ea1; margin-top: 6px; white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow: auto; }
</style>
</head>
<body>
<div class="lang" id="lang-btn">EN</lang-btn></div>
<div id="app">
  <div class="logo">🚀</div>
  <h1>Launch Pilot</h1>
  <div class="plan" id="plan-name"></div>
  <div class="plan-desc" id="plan-desc"></div>
  <div class="price" id="price"></div>
  <div class="ton-amount" id="ton-amount"></div>
  <div class="divider"></div>
  <div id="tonconnect"></div>
  <div id="balance"></div>
  <button class="main" id="pay-btn"></button>
  <button class="ghost" id="tg-btn" style="display:none"></button>
  <div id="status"></div>
  <div class="code-box" id="code-box"></div>
  <details id="dbg-wrap" style="display:none">
    <summary>⚙️ если что-то сломалось — открой (фото для поддержки)</summary>
    <pre id="dbg"></pre>
  </details>
</div>

<script src="https://unpkg.com/@tonconnect/ui" type="module" crossorigin></script>
<script type="module">
// ================= НАСТРОЙКИ (меняем только здесь) =================
const WALLET = "";            // <-- кошелёк для приёма (base64, начинается с UQ/EQ) — поставит владелец
const CONFIRM_URL = "";       // <-- адрес бота для авто-подтверждения (поставит владелец)
const TG_BOT = "PHlaunchpilot_bot";
const GAS_TON = 0.1;          // запас на газ, чтобы «оплатил только газ» больше не повторялось
const PLANS = {
  kit:       { usd: 19, ru: "Запуск Kit",            ruD: "все тексты + день + хантеры",            en: "Launch Kit",              enD: "all texts + best day + hunters" },
  autopilot: { usd: 49, ru: "Автопилот — День X",    ruD: "Kit + комната комментариев 24/7 + отчёт", en: "Autopilot — Day X",       enD: "Kit + comment radar 24/7 + report" },
};
// ===================================================================

const params = new URL(location.href).searchParams;
const planKey = PLANS[params.get("plan")] ? params.get("plan") : "autopilot";
let L = (navigator.language || "en").toLowerCase().startsWith("ru") ? "ru" : "en";
let code = params.get("code") || sessionStorage.getItem("lp_code") || genCode();
sessionStorage.setItem("lp_code", code);
let connector = null, myAddress = null, balanceNano = "0", rate = null, paying = false;
let shownTx = null;

const $ = (id) => document.getElementById(id);
const el = { plan: $("plan-name"), planD: $("plan-desc"), price: $("price"), ton: $("ton-amount"),
  bal: $("balance"), pay: $("pay-btn"), tg: $("tg-btn"), st: $("status"), codeBox: $("code-box"), dbg: $("dbg") };

function genCode() {
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  const c = new Uint8Array(6); crypto.getRandomValues(c);
  for (const x of c) s += A[x % A.length];
  return s;
}
function dbg(msg) {
  el.dbg.textContent += new Date().toISOString().slice(11, 19) + " " + msg + "\n";
  try { $("dbg-wrap").style.display = "block"; } catch (e) {}
}
function status(msg, cls) { el.st.textContent = msg; el.st.className = cls || ""; }
const fmt = (n) => (n / 1e9).toFixed(2);

function render() {
  const p = PLANS[planKey];
  document.documentElement.lang = L;
  $("lang-btn").textContent = L === "ru" ? "EN" : "RU";
  el.plan.textContent = L === "ru" ? p.ru : p.en;
  el.planD.textContent = L === "ru" ? p.ruD : p.enD;
  el.price.textContent = "$" + p.usd;
  el.tg.textContent = L === "ru" ? "↩ Вернуться в бота" : "↩ Back to the bot";
  el.tg.onclick = () => { location.href = "tg://resolve?domain=" + TG_BOT; };
  if (!rate) { el.ton.textContent = L === "ru" ? "получаем курс TON…" : "fetching TON rate…"; el.ton.className = "ton-amount warn"; }
  else el.ton.textContent = "≈ " + neededTon().toFixed(2) + " TON";
  el.pay.textContent = WALLET
    ? (L === "ru" ? "Оплатить " : "Pay ") + (rate ? neededTon().toFixed(2) + " TON" : "")
    : (L === "ru" ? "⚙️ Оплата ещё не настроена" : "⚙️ Payment not configured yet");
  el.pay.disabled = !WALLET || !rate || paying || !connector;
  if (myAddress) {
    const need = rate ? (PLANS[planKey].usd / rate + GAS_TON) : null;
    const have = parseFloat(balanceNano) / 1e9;
    if (need === null) { el.bal.textContent = ""; el.bal.className = ""; }
    else if (have >= need) { el.bal.textContent = "✅ " + fmt(balanceNano) + " TON — " + (L === "ru" ? "хватает" : "enough"); el.bal.className = "ok"; }
    else { el.bal.textContent = "❌ " + (L === "ru" ? "Не хватает. Нужно " : "Not enough. Need ") + need.toFixed(2) + " TON (" + (L === "ru" ? "плата + газ" : "price + gas") + ")"; el.bal.className = "bad"; }
  }
}
function neededTon() { return PLANS[planKey].usd / rate; }

async function getRate() {
  try {
    const r = await fetch("https://tonapi.io/v2/exchangeRate");
    const j = await r.json();
    const pair = (j.pairs || []).find(p => p.base === "TON" && p.quote === "USD");
    if (pair && pair.rate) { rate = pair.rate; render(); return; }
    throw 0;
  } catch (e) {}
  try {
    const r = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=the-open-network&vs_currencies=usd");
    const j = await r.json();
    const v = j["the-open-network"] && j["the-open-network"].usd;
    if (v) { rate = v; render(); return; }
    throw 0;
  } catch (e) {}
  rate = null; render();
  status(L === "ru" ? "Курс не получен. Перезагрузи страничку." : "Rate unavailable. Reload the page.", "err");
}

async function pay() {
  if (!WALLET || !rate || paying || !connector) return;
  paying = true; render();
  try {
    const nano = String(Math.ceil(neededTon() * 1e9));
    status(L === "ru" ? "Подтверди оплату в кошельке…" : "Confirm the payment in your wallet…");
    const tx = await connector.sendTransaction({
      validUntil: Math.floor(Date.now() / 1000) + 3600,
      dest: WALLET,
      value: nano,
      bounce: false,
    });
    shownTx = tx && tx.hash;
    status(L === "ru" ? "⏳ Транзакция уходит в сеть…" : "⏳ Transaction is on its way…");
    try { await connector.waitForTransaction(tx.hash, 180000); } catch (e) { dbg("waitForTransaction: " + (e && e.message || e)); }
    if (CONFIRM_URL) {
      fetch(CONFIRM_URL, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code, tx: shownTx, address: myAddress, value: nano, plan: planKey }) }).catch(e => dbg("confirm post: " + e));
    }
    success();
  } catch (e) {
    dbg("pay error: " + (e && (e.message || JSON.stringify(e)) || e));
    paying = false;
    status(L === "ru" ? "Не отправилось. Попробуй ещё раз." : "Failed. Try again.", "err");
    render();
  }
}
function success() {
  el.codeBox.style.display = "block";
  el.codeBox.textContent = code;
  el.codeBox.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(code); status(L === "ru" ? "Код скопирован ✅" : "Code copied ✅", "good"); };
  el.pay.style.display = "none";
  el.tg.style.display = "block";
  status(L === "ru"
    ? "🎉 Готово! Бот уже отправляет товар. Если что-то не дошло — пришли боту код выше."
    : "🎉 Done! The bot is delivering your order. If anything is missing — send the code above to the bot.", "good");
}

$("lang-btn").onclick = () => { L = L === "ru" ? "en" : "ru"; render(); };
el.pay.onclick = pay;

// TON Connect
try {
  const mod = await import("https://unpkg.com/@tonconnect/ui");
  connector = await mod.createTONConnector();
  const provider = new mod.TONConnectorProvider({ container: $("tonconnect"), connector, useEmbedModal: true });
  provider.init();
  connector.on("accountList", (accounts) => {
    try {
      const a = (accounts || [])[0];
      if (a) { myAddress = a.address; balanceNano = a.balance || "0"; }
      else { myAddress = null; balanceNano = "0"; el.bal.textContent = ""; el.bal.className = ""; }
      render();
    } catch (e) { dbg("accountList: " + e); }
  });
  connector.on("statusChange", (s) => { if (!s) { myAddress = null; balanceNano = "0"; render(); } });
} catch (e) {
  dbg("TON Connect init: " + (e && e.message || e));
  status(L === "ru" ? "Не удалось загрузить кошельки. Перезагрузи." : "Failed to load wallets. Reload.", "err");
}
getRate();
render();
dbg("started, plan=" + planKey + ", code=" + code + ", wallet=" + (WALLET || "EMPTY(test mode)"));
window.addEventListener("error", (e) => dbg("window error: " + e.message));
</script>
</body>
</html>
